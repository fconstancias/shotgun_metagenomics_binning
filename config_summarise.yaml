# -------------------------------------------------------------------
# Input Tables & Sourcing
# -------------------------------------------------------------------
assemblies_tsv: "assemblies.tsv"
mappings_tsv: "mappings.tsv"
output_dir: "results"

# -------------------------------------------------------------------
# Binette (multi-binner refinement, optional)
# -------------------------------------------------------------------
# Reads the raw per-binner bins already produced by metagenome_binning.smk
# (in output_dir above) and refines them. Requires >=2 binners to have been
# run there.
run_binette: false
binette_checkm2_db: "/data/databases/checkm2/CheckM2_database/uniref100.KO.1.dmnd"

# Optional: pre-installed conda env path for Binette (skip yaml-based install)
conda_dirs:
  binette: null   # e.g. /home/ljc444/.conda/envs/binette_env

# When run_binette: true, Binette already scores every winning bin with
# CheckM2 (final_bins_quality_reports.tsv, per group). Set this to true to
# build dRep's genomeInfo directly from those reports instead of running
# CheckM1 a second time on the same bin set -- skips the checkm rule
# entirely. No effect if run_binette is false (nothing to reuse).
use_binette_checkm2_for_drep: false

# -------------------------------------------------------------------
# Post-Binning Database Paths
# -------------------------------------------------------------------
checkm_db_path: "/maps/projects/hansen_ol-AUDIT/scratch/checkm"
checkm_outdir_name: "checkm1"
checkm_extension: "gz"
gtdbtk_db_path: "/maps/projects/hansen_ol-AUDIT/scratch/GTDB/release226"
gtdbtk_extension: "gz"
gtdbtk_min_af: 0.5
gtdbtk_pplacer_cpus: 8
gtdbtk_write_single_copy_genes: true
gtdbtk_keep_intermediates: true

# -------------------------------------------------------------------
# dRep Dereplication Thresholds
# -------------------------------------------------------------------
drep_completeness: 66
drep_contamination: 20
drep_primary_ani: 0.95
drep_secondary_ani: 0.98
drep_min_overlap: 0.30
drep_s_algorithm: "ANIn"