# -------------------------------------------------------------------
# Test B: Pre-existing assemblies, Anvi'o reformat, all binners, Binette
# -------------------------------------------------------------------
assemblies_tsv: "assemblies_toy.tsv"
mappings_tsv:   "mappings_toy.tsv"
output_dir:     "results_toy_full"
assembler:      "spades"

# Anvi'o reformat: simplify contig headers and filter short contigs
# bowtie2-build runs from the reformatted FASTA so names stay consistent
anvi_reformat:      true
anvi_min_contig_len: 1000

# Run all three binners (Binette refinement now runs in summarise_mags.smk —
# see toy/config_summarise_toy_full.yaml).
# semibin2 uses -b (BAMs) directly and only runs for all-bowtie2 groups.
# mappings_toy.tsv maps spaS144 with bowtie2 for every sample (the
# co-assembly-style policy — SemiBin2-capable) on purpose, so this scenario
# exercises both mapping_tool policies at once; spaS276/spaS135 keep the
# mixed bowtie2-self + strobealign-cross policy, so semibin2 skips them.
binners:            [metabat2, semibin2, vamb]

conda_dirs:
  mapping:  /home/ljc444/.conda/snakemake_envs/953074478001cdc0d34692963ffdc07e_
  binning:  /home/ljc444/.conda/snakemake_envs/7f98d8a39e48151911f533947efd5a37_
  semibin2: /home/ljc444/.conda/envs/semibin
  vamb:     /home/ljc444/.conda/snakemake_envs/7e256d09b67c0cdacf44b5594580506b_
  anvio:    /home/ljc444/.conda/envs/anvio-9

metabat2:
  min_contig:   2000
  max_edges:    500
  min_cv:       1.0
  min_cv_sum:   1.0
  max_p:        95
  min_s:        60
  min_cls_size: 200000
  save_cls:     true
  verbose:      true
